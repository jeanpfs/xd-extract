name: nightly-live
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:live
        env:
          XD_LIVE_POSITIVE_URL: ${{ vars.XD_LIVE_POSITIVE_URL }}
